[project]
name = "ai-asset-platform"
version = "0.1.0"
description = "AI 素材生成平台 - 基于 FastAPI 的电商素材生成系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.1",
    
    # Task Queue
    "celery>=5.3.6",
    "flower>=2.0.1",
    
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    
    # Storage
    "boto3>=1.34.0",
    "minio>=7.2.0",
    
    # Utils
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
# AI/ML 相关依赖（可选，GPU 节点需要）
ai = [
    "torch>=2.1.2",
    "torchvision>=0.16.2",
    "diffusers>=0.25.0",
    "transformers>=4.36.2",
    "accelerate>=0.26.1",
    "controlnet-aux>=0.0.7",
    "rembg>=2.0.50",
    "pillow>=10.2.0",
    "opencv-python>=4.9.0.80",
    "langchain>=0.1.0",
    "langgraph>=0.0.40",
]

# 开发工具
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.uv]
# 使用国内镜像源
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.sources]
# 可以添加自定义源

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
